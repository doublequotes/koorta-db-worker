name = "koorta-db-worker"
main = "src/index.js"
compatibility_date = "2026-08-09"

[vars]
ACCESS_ISSUER = "https://koortadotcom.cloudflareaccess.com"
ACCESS_AUD = "1016bc0e09dd8e7703407cb47a90270907c16d523044f44f71b0ba3ac73acc03"
ADMIN_UI_ORIGINS = "https://koorta.com"
RESEND_FROM_EMAIL = "Koorta Orders <admin@koorta.com>"
TURNSTILE_HOSTNAMES = "koorta.com,www.koorta.com"

# Secret references only. Set these with `npx wrangler secret put <NAME>`;
# do not uncomment or add secret values to this file.
# RESEND_API_KEY
# TURNSTILE_SECRET_KEY
# SHIPROCKET_EMAIL
# SHIPROCKET_PASSWORD
# SHIPROCKET_WEBHOOK_SECRET

# Match this label exactly to a pickup location configured in the Shiprocket account.
SHIPROCKET_PICKUP_LOCATION = "work"
# Starting estimate for two folded men's kurtas in one poly-mailer; measure the packed parcel.
SHIPROCKET_PARCEL_LENGTH = "30"
SHIPROCKET_PARCEL_BREADTH = "25"
SHIPROCKET_PARCEL_HEIGHT = "8"
SHIPROCKET_PARCEL_WEIGHT = "1.0"
# Reverse-pickup destination (can be the same premises, but is a full address, not the label above).
SHIPROCKET_RETURN_NAME = "KOORTA.com"
SHIPROCKET_RETURN_ADDRESS = "Meghwal-Ramnagar Road, Plot No. 377, Naraynapur, Ward No. 7"
SHIPROCKET_RETURN_CITY = "Ramnagar"
SHIPROCKET_RETURN_STATE = "Bihar"
SHIPROCKET_RETURN_PINCODE = "845106"
SHIPROCKET_RETURN_PHONE = "+917838534597"
SHIPROCKET_RETURN_EMAIL = "admin@koorta.com"
SHIPROCKET_RETURN_PICKUP_EMAIL = "admin@koorta.com"

[[d1_databases]]
binding = "KOORTA_DB"
database_name = "koorta_db"

[[kv_namespaces]]
binding = "SHIPROCKET_TOKEN_CACHE"
id = "b29f9d5d52ed4d08bc5bb7016f44a19a"

[[r2_buckets]]
binding = "GARMENT_BUCKET"
bucket_name = "garment-catalog"

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
# ...
